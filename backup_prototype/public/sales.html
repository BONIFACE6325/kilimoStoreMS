<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sales — AgroVault ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="layout">
  <div id="nav-mount"></div>
  <div class="main-area">
    <div id="top-mount"></div>
    <div class="page-content">

      <div class="page-header anim-fade-up">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <div class="page-title">Sales &amp; Invoicing</div>
            <div class="page-desc">Manage buyer transactions, invoices, and sales analytics</div>
          </div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-secondary btn-sm" id="btnExportSales">Export</button>
            <button class="btn btn-primary btn-sm" id="btnNewInvoice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              New Invoice
            </button>
          </div>
        </div>
      </div>

      <!-- KPIs -->
      <div id="salesKpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:24px" class="anim-fade-up anim-delay-1"></div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px">
        <div class="chart-box anim-fade-up anim-delay-2">
          <div class="section-header"><div class="section-title">Sales Revenue Trend</div><div class="section-sub">Last 8 months (TZS Millions)</div></div>
          <div style="height:200px"><canvas id="salesChart" style="width:100%;height:100%"></canvas></div>
        </div>
        <div class="chart-box anim-fade-up anim-delay-3">
          <div class="section-title" style="margin-bottom:14px">Top Buyers</div>
          <div id="topBuyers"></div>
        </div>
      </div>

      <!-- Invoices table -->
      <div class="card anim-fade-up anim-delay-4" style="overflow:hidden">
        <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div class="section-title">Recent Invoices</div>
          <div style="display:flex;gap:8px">
            <input type="text" placeholder="Search invoice…" class="form-input" style="width:200px"/>
            <select class="form-input form-select" style="width:130px"><option>All Status</option><option>Paid</option><option>Pending</option><option>Overdue</option></select>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>Invoice #</th><th>Buyer</th><th>Crop</th><th>Qty (MT)</th><th>Unit Price</th><th>Total</th><th>Date</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="invoiceBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal -->
<div id="newSaleModal" class="modal-overlay">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title">Create Invoice</div>
      <button id="closeSaleModal" style="background:none;border:none;cursor:pointer;color:var(--text3)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div style="grid-column:1/-1"><label class="form-label">Buyer *</label><select class="form-input form-select"><option>Select buyer…</option><option>AgriCo Ltd</option><option>Grain Masters</option></select></div>
        <div><label class="form-label">Crop Type *</label><select class="form-input form-select"><option>Select crop…</option><option>Maize</option><option>Rice</option><option>Beans</option></select></div>
        <div><label class="form-label">Quantity (MT) *</label><input type="number" class="form-input" placeholder="0.00"/></div>
        <div><label class="form-label">Unit Price (TZS/MT) *</label><input type="number" class="form-input" placeholder="0.00"/></div>
        <div><label class="form-label">Invoice Date</label><input type="date" class="form-input"/></div>
        <div><label class="form-label">Payment Terms</label><select class="form-input form-select"><option>15 days</option><option>30 days</option><option>60 days</option></select></div>
        <div style="grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px"><span>Subtotal</span><span id="calcSubtotal">—</span></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px"><span>VAT (18%)</span><span>—</span></div>
          <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--text);border-top:1px solid var(--border);padding-top:8px;margin-top:4px"><span>Total</span><span>TZS 0.00</span></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelSaleModal">Cancel</button>
      <button class="btn btn-secondary" onclick="showToast('Draft saved','info')">Save Draft</button>
      <button class="btn btn-primary" id="submitSaleForm">Create Invoice</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/components.js"></script>
<script>
renderNav('sales.html');

// KPIs
var salesKpiData = [['TZS 284M','Month Revenue','#10b981','↑ 18% vs last month'],['142','Total Invoices','#6366f1','38 this week'],['28','Pending Payment','#d97706','TZS 82M outstanding'],['4','Top Buyers','#6366f1','80% of volume'],['48,200 MT','Volume Sold MTD','#10b981','Goal: 60,000 MT']];
var salesKpis = document.getElementById('salesKpis');
salesKpiData.forEach(function(k) {
  var d = document.createElement('div');
  d.className = 'kpi-card';
  d.innerHTML = '<div class="kpi-value" style="color:' + k[2] + ';font-size:21px">' + k[0] + '</div><div class="kpi-label">' + k[1] + '</div><div style="font-size:11.5px;color:var(--text3);margin-top:4px">' + k[3] + '</div>';
  salesKpis.appendChild(d);
});

// Top buyers
var buyers = [['AgriCo Ltd','32,400 MT','TZS 128M','active'],['Grain Masters','18,200 MT','TZS 72M','active'],['Farmers Co-op','12,800 MT','TZS 51M','active'],['NMB Export','8,100 MT','TZS 33M','inactive']];
var buyersDiv = document.getElementById('topBuyers');
buyers.forEach(function(b, i) {
  var d = document.createElement('div');
  d.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 0;' + (i < buyers.length-1 ? 'border-bottom:1px solid var(--border)' : '');
  d.innerHTML = '<div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#10b981,#6366f1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white;flex-shrink:0">' + (i+1) + '</div>'
    + '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--text)">' + b[0] + '</div><div style="font-size:11.5px;color:var(--text3)">' + b[1] + '</div></div>'
    + '<div style="text-align:right"><div style="font-size:13px;font-weight:700;color:#059669">' + b[2] + '</div><span class="badge ' + (b[3]==='active'?'badge-green':'badge-gray') + '" style="font-size:10.5px">' + b[3] + '</span></div>';
  buyersDiv.appendChild(d);
});

// Invoices
var invoices = [
  ['INV-2241','AgriCo Ltd','Maize','200','TZS 420/MT','TZS 84M','10 Jun 2026','25 Jun 2026','paid'],
  ['INV-2240','Grain Masters','Rice','150','TZS 680/MT','TZS 102M','09 Jun 2026','24 Jun 2026','pending'],
  ['INV-2239','AgriCo Ltd','Beans','80','TZS 850/MT','TZS 68M','08 Jun 2026','23 Jun 2026','pending'],
  ['INV-2238','Farmers Co-op','Maize','320','TZS 415/MT','TZS 132.8M','07 Jun 2026','22 Jun 2026','paid'],
  ['INV-2237','NMB Export','Wheat','90','TZS 520/MT','TZS 46.8M','05 Jun 2026','05 Jun 2026','overdue'],
  ['INV-2236','Grain Masters','Rice','200','TZS 670/MT','TZS 134M','03 Jun 2026','18 Jun 2026','paid'],
];
var invBody = document.getElementById('invoiceBody');
invoices.forEach(function(inv) {
  var stClass = inv[8]==='paid'?'badge-green':inv[8]==='pending'?'badge-amber':'badge-red';
  var dueColor = inv[8]==='overdue' ? '#dc2626' : 'var(--text3)';
  var tr = document.createElement('tr');
  tr.innerHTML = '<td><code style="font-size:12px;color:#4338ca;font-weight:600">' + inv[0] + '</code></td>'
    + '<td><strong>' + inv[1] + '</strong></td>'
    + '<td><span class="badge badge-green" style="font-size:11px">' + inv[2] + '</span></td>'
    + '<td>' + inv[3] + '</td>'
    + '<td style="color:var(--text3)">' + inv[4] + '</td>'
    + '<td><strong>' + inv[5] + '</strong></td>'
    + '<td style="color:var(--text3)">' + inv[6] + '</td>'
    + '<td style="color:' + dueColor + ';font-weight:' + (inv[8]==='overdue'?'600':'400') + '">' + inv[7] + '</td>'
    + '<td><span class="badge ' + stClass + '"><span class="dot"></span>' + inv[8] + '</span></td>'
    + '<td><div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" style="padding:5px 10px;font-size:12px" onclick="showToast(\'Viewing ' + inv[0] + '…\',\'info\')">View</button><button class="btn btn-secondary btn-sm" style="padding:5px 10px;font-size:12px" onclick="showToast(\'Downloading PDF…\',\'info\')">PDF</button></div></td>';
  invBody.appendChild(tr);
});

// Events
document.getElementById('btnExportSales').onclick = function() { showToast('Exporting sales report…','info'); };
document.getElementById('btnNewInvoice').onclick = function() { document.getElementById('newSaleModal').classList.add('open'); };
document.getElementById('closeSaleModal').onclick = function() { document.getElementById('newSaleModal').classList.remove('open'); };
document.getElementById('cancelSaleModal').onclick = function() { document.getElementById('newSaleModal').classList.remove('open'); };
document.getElementById('submitSaleForm').onclick = function() { showToast('Invoice created successfully!','success'); document.getElementById('newSaleModal').classList.remove('open'); };
document.getElementById('newSaleModal').addEventListener('click', function(e) { if(e.target===this) this.classList.remove('open'); });

document.addEventListener('DOMContentLoaded', function() {
  drawBarChart('salesChart', ['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'], [188,214,196,238,222,261,244,284], ['#10b981','#6366f1','#f59e0b','#f97316','#10b981','#6366f1','#f59e0b','#10b981']);
});
</script>
</body>
</html>
