server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # ── FRONTEND VUE SPA ─────────────────────────────────────────────────────
    root /var/www/kilimostore/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── BACKEND LARAVEL API ──────────────────────────────────────────────────
    location ^~ /api/ {
        alias /var/www/kilimostore/backend/public/;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        fastcgi_pass unix:PHP_FPM_SOCKET;
        include fastcgi_params;
        
        # Hardcode the path to Laravel's index.php
        fastcgi_param SCRIPT_FILENAME /var/www/kilimostore/backend/public/index.php;
        
        # Pass the original request URI so Laravel routing works
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/kilimostore/backend/public;
    }

    # ── SECURITY ─────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    error_log  /var/log/nginx/kilimostore_error.log;
    access_log /var/log/nginx/kilimostore_access.log;
}
