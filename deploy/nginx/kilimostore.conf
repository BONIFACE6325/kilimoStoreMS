server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── BACKEND LARAVEL API ──────────────────────────────────────────────────
    # ALL /api/* requests go to Laravel backend first
    location ~ ^/api {
        root /var/www/kilimostore/backend/public;
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/kilimostore/backend/public/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param DOCUMENT_ROOT   /var/www/kilimostore/backend/public;
            fastcgi_pass  unix:PHP_FPM_SOCKET;
            fastcgi_read_timeout 120;
        }
    }

    # ── FRONTEND VUE SPA ─────────────────────────────────────────────────────
    root  /var/www/kilimostore/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SECURITY ─────────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    error_log  /var/log/nginx/kilimostore_error.log;
    access_log /var/log/nginx/kilimostore_access.log;
}
