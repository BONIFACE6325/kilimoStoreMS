<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Settings — AgroVault ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="layout">
  <div id="nav-mount"></div>
  <div class="main-area">
    <div id="top-mount"></div>
    <div class="page-content">
      <div class="page-header anim-fade-up">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <a href="index.html" style="font-size:13px;color:var(--text3)">Dashboard</a>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3)"><polyline points="9 18 15 12 9 6"/></svg>
              <span style="font-size:13px;font-weight:600;color:var(--text)">Settings</span>
            </div>
            <div class="page-title">⚙️ Settings</div>
            <div class="page-desc">System configuration, users, roles, and preferences</div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="showToast('Opening form…','info')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Entry
          </button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center" class="anim-fade-up anim-delay-1">
        <div style="width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(99,102,241,.08));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px">⚙️</div>
        <div style="font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px">Settings Module</div>
        <div style="font-size:15px;color:var(--text3);max-width:440px;line-height:1.7;margin-bottom:28px">System configuration, users, roles, and preferences. This module integrates with your Laravel API endpoints and Vue.js components.</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-primary" onclick="showToast('Settings loading…','success')">Load Settings Data</button>
          <a href="index.html" class="btn btn-outline">← Back to Dashboard</a>
        </div>
        <div style="margin-top:40px">
        <div class="card" style="padding:20px;width:300px;text-align:left">
          <div style="font-weight:700;margin-bottom:14px;color:var(--text)">System Preferences</div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <label style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text2)">Dark Mode <input type="checkbox" style="accent-color:var(--emerald-500)" onchange="toggleTheme()"/></label>
            <label style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text2)">Email Notifications <input type="checkbox" checked style="accent-color:var(--emerald-500)"/></label>
            <label style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text2)">SMS Alerts <input type="checkbox" style="accent-color:var(--emerald-500)"/></label>
            <label style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text2)">Auto Daily Reports <input type="checkbox" checked style="accent-color:var(--emerald-500)"/></label>
            <label style="display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--text2)">Low Stock Alerts <input type="checkbox" checked style="accent-color:var(--emerald-500)"/></label>
          </div>
        </div></div>
      </div>
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
<script src="assets/components.js"></script>
<script>renderNav('settings.html');</script>
</body>
</html>
