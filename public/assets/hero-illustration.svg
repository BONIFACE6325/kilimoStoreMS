<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ecfdf5"/><stop offset="100%" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#bg)"/>
  <!-- Ground -->
  <ellipse cx="300" cy="420" rx="260" ry="40" fill="#d1fae5" opacity="0.6"/>
  <!-- Warehouse -->
  <rect x="80" y="280" width="200" height="140" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="80,280 180,200 280,280" fill="url(#g1)"/>
  <rect x="150" y="340" width="60" height="80" fill="#6366f1" opacity="0.8" rx="4"/>
  <rect x="100" y="300" width="50" height="40" rx="3" fill="#a7f3d0"/>
  <rect x="210" y="300" width="50" height="40" rx="3" fill="#a7f3d0"/>
  <!-- Silo 1 -->
  <rect x="310" y="240" width="70" height="180" rx="35 35 8 8" fill="url(#g2)"/>
  <ellipse cx="345" cy="240" rx="35" ry="15" fill="#818cf8"/>
  <!-- Silo 2 -->
  <rect x="395" y="270" width="55" height="150" rx="27 27 6 6" fill="#059669"/>
  <ellipse cx="422" cy="270" rx="27" ry="11" fill="#34d399"/>
  <!-- Wheat left -->
  <line x1="50" y1="380" x2="50" y2="220" stroke="#10b981" stroke-width="3"/>
  <ellipse cx="50" cy="215" rx="8" ry="20" fill="#34d399" opacity="0.8"/>
  <line x1="30" y1="380" x2="30" y2="240" stroke="#10b981" stroke-width="2"/>
  <ellipse cx="30" cy="236" rx="6" ry="15" fill="#6ee7b7" opacity="0.7"/>
  <!-- Wheat right -->
  <line x1="540" y1="380" x2="540" y2="220" stroke="#f59e0b" stroke-width="3"/>
  <ellipse cx="540" cy="215" rx="8" ry="20" fill="#fbbf24" opacity="0.8"/>
  <line x1="560" y1="380" x2="560" y2="245" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="560" cy="241" rx="6" ry="15" fill="#fcd34d" opacity="0.7"/>
  <!-- Floating data cards -->
  <rect x="440" y="120" width="140" height="70" rx="12" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <rect x="452" y="135" width="8" height="8" rx="2" fill="#10b981"/>
  <rect x="468" y="133" width="60" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="468" y="145" width="40" height="6" rx="3" fill="#f1f5f9"/>
  <rect x="452" y="158" width="116" height="20" rx="4" fill="#ecfdf5"/>
  <rect x="460" y="163" width="50" height="8" rx="3" fill="#34d399"/>
  <!-- Mini bar chart -->
  <rect x="20" y="140" width="120" height="80" rx="10" fill="white" opacity="0.85"/>
  <rect x="35" y="185" width="10" height="25" rx="2" fill="#10b981"/>
  <rect x="52" y="175" width="10" height="35" rx="2" fill="#6366f1"/>
  <rect x="69" y="165" width="10" height="45" rx="2" fill="#f59e0b"/>
  <rect x="86" y="170" width="10" height="40" rx="2" fill="#10b981"/>
  <rect x="103" y="160" width="10" height="50" rx="2" fill="#6366f1"/>
  <rect x="28" y="130" width="70" height="8" rx="3" fill="#e2e8f0"/>
</svg>
