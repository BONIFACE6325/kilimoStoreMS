<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Drying — AgroVault ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body>
<div class="layout">
  <div id="nav-mount"></div>
  <div class="main-area">
    <div id="top-mount"></div>
    <div class="page-content">

      <div class="page-header anim-fade-up">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <a href="index.html" style="font-size:13px;color:var(--text3)">Dashboard</a>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3)"><polyline points="9 18 15 12 9 6"/></svg>
              <span style="font-size:13px;font-weight:600;color:var(--text)">Drying</span>
            </div>
            <div class="page-title">☀️ Grain Drying Job Operations</div>
            <div class="page-desc">Monitor drying jobs and update results</div>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px" class="anim-fade-up anim-delay-1">
        <div class="kpi-card">
          <div class="kpi-value" id="kpiActiveDryingJobs">0</div>
          <div class="kpi-label">Active Drying Jobs</div>
        </div>
        
        <div class="kpi-card">
          <div class="kpi-value" id="kpiDryerUtilization" style="color:var(--emerald-500)">65%</div>
          <div class="kpi-label">Dryer Capacity Utilization</div>
        </div>
      </div>

      <!-- Main Log -->
      <div class="card anim-fade-up anim-delay-2" style="overflow:hidden">
        <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div class="section-title">Active &amp; Queued Batches for Drying</div>
          <div style="display:flex;gap:8px">
            <input type="text" id="dryingSearch" placeholder="Search batch…" class="form-input" style="width:200px" oninput="filterTable()"/>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Batch Code</th>
                <th>Farmer Name</th>
                <th>Crop</th>
                <th>Weight (Kg)</th>
                
                
                <th>Drying Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="dryingTableBody">
              <tr>
                <td colspan="8" style="text-align:center;color:var(--text3);padding:30px 0;">Loading drying data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal to update moisture / complete job -->
<div id="dryingModal" class="modal-overlay">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title" id="dryingModalTitle">Complete Drying Job</div>
      <button id="closeDryingModal" style="background:none;border:none;cursor:pointer;color:var(--text3)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="dryingForm" style="display:grid;grid-template-columns:1fr;gap:14px">
        <input type="hidden" id="dryingBatchId"/>
        <div>
          <label class="form-label">Batch Code</label>
          <input type="text" id="dryingBatchCode" class="form-input" readonly style="background:var(--surface2)"/>
        </div>
        <div>
          <label class="form-label">Final Weight (Kg) after Drying *</label>
          <input type="number" step="0.1" id="dryingFinalMoisture" class="form-input" placeholder="e.g. 12.0" required/>
          <div style="font-size:11.5px;color:var(--text3);margin-top:4px"></div>
        </div>
        <div>
          <label class="form-label">Drying Service Fee (TZS) *</label>
          <input type="number" id="dryingFee" class="form-input" placeholder="e.g. 50000" required/>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelDryingModal">Cancel</button>
      <button class="btn btn-primary" id="saveDryingBtn">Confirm Completion</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/components.js"></script>
<script>
renderNav('drying.html');

let allBatches = [];

async function loadData() {
  try {
    const res = await fetch('/api/v1/batches');
    const batches = await res.json();
    
    // Filter batches that require drying or are actively being dried
    allBatches = batches.filter(b => b.status === 'drying');
    
    renderStats();
    renderTable(allBatches);
  } catch (err) {
    console.error(err);
    showToast('Failed to load drying data', 'error');
  }
}

function renderStats() {
  const activeCount = allBatches.filter(b => b.status === 'drying').length;
  document.getElementById('kpiActiveDryingJobs').textContent = activeCount;
}

function renderTable(data) {
  const tbody = document.getElementById('dryingTableBody');
  tbody.innerHTML = '';
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:20px 0;">No batches require drying at this moment.</td></tr>';
    return;
  }
  data.forEach(b => {
    tbody.innerHTML += `
      <tr>
        <td><code style="font-weight:600;color:var(--indigo-600)">${b.batch_code}</code></td>
        <td><strong>${b.farmer_name}</strong></td>
        <td><span class="badge badge-green">${b.crop_type}</span></td>
        <td><strong>${(parseFloat(b.current_weight)*1000).toLocaleString()} Kg</strong></td>
        
        
        <td><span class="badge badge-amber"><span class="dot"></span>Drying active</span></td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="openDryingModal('${b.id}', '${b.batch_code}')">Complete Drying</button>
        </td>
      </tr>
    `;
  });
}

function filterTable() {
  const query = document.getElementById('dryingSearch').value.toLowerCase();
  const filtered = allBatches.filter(b => b.batch_code.toLowerCase().includes(query) || b.farmer_name.toLowerCase().includes(query));
  renderTable(filtered);
}

const modal = document.getElementById('dryingModal');
function openDryingModal(id, code) {
  document.getElementById('dryingBatchId').value = id;
  document.getElementById('dryingBatchCode').value = code;
  document.getElementById('dryingFinalMoisture').value = '12.0';
  document.getElementById('dryingFee').value = '45000';
  modal.classList.add('open');
}

document.getElementById('closeDryingModal').onclick = () => modal.classList.remove('open');
document.getElementById('cancelDryingModal').onclick = () => modal.classList.remove('open');

document.getElementById('saveDryingBtn').onclick = async (e) => {
  e.preventDefault();
  const id = document.getElementById('dryingBatchId').value;
  const finalMoisture = parseFloat(document.getElementById('dryingFinalMoisture').value);
  const fee = parseFloat(document.getElementById('dryingFee').value);

  if (isNaN(finalMoisture) || isNaN(fee)) {
    showToast('Please fill out all required fields', 'error');
    return;
  }

  try {
    const res = await fetch(`/api/v1/batches/${id}/processing`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'drying',
        status: 'completed',
        final_value: finalMoisture,
        fee: fee
      })
    });
    const data = await res.json();
    if (data.success) {
      showToast(`Batch ${data.batch.batch_code} dried to ${finalMoisture}%. Fee of TZS ${fee.toLocaleString()} charged.`, 'success');
      modal.classList.remove('open');
      loadData();
    } else {
      showToast(data.error || 'Failed to update drying job', 'error');
    }
  } catch (err) {
    console.error(err);
    showToast('Network error while completing job', 'error');
  }
};

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
