name: Deploy KilimoStoreMS to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  validate-backend:
    name: 🧪 1. Validate & Test Backend (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      - name: Install & Validate Composer Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

  build-frontend:
    name: 🎨 2. Build & Validate Frontend (Vue 3 / Vite)
    needs: validate-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Compile Production Assets
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-to-ec2:
    name: 🚀 3. Deploy Production Build to AWS EC2
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: SSH to AWS EC2 & Trigger Automated Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on AWS EC2..."
            cd /var/www/kilimostore
            
            echo "🛠️ Preparing Directory & SQLite Permissions..."
            sudo chown -R www-data:www-data /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database || true
            sudo chmod -R 777 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database || true
            sudo touch /var/www/kilimostore/backend/database/database.sqlite || true
            sudo chown www-data:www-data /var/www/kilimostore/backend/database/database.sqlite || true
            sudo chmod 666 /var/www/kilimostore/backend/database/database.sqlite || true

            echo "📥 Pulling latest commits from GitHub..."
            git pull origin main || git pull origin master
            
            echo "⚙️ Running Backend Composer & Migrations..."
            cd /var/www/kilimostore/backend
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force || true
            php artisan db:seed --force || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true

            echo "🔒 Ensuring Nginx & www-data Write Access to SQLite & Storage..."
            sudo chown -R www-data:www-data /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database || true
            sudo chmod -R 777 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database || true
            sudo chmod 666 /var/www/kilimostore/backend/database/database.sqlite || true
            
            echo "🎨 Building Production Frontend Assets..."
            cd /var/www/kilimostore/frontend
            npm ci
            npm run build
            
            echo "🔐 Securing Permissions & Reloading Nginx/PHP-FPM..."
            sudo chown -R www-data:www-data /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database
            sudo chmod -R 777 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database
            sudo systemctl reload nginx
            sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm
            
            echo "✅ KilimoStoreMS Deployed Successfully to AWS EC2!"
