name: Deploy KilimoStoreMS to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Auto Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: SSH to AWS EC2 & Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Deployment on AWS EC2..."
            cd /var/www/kilimostore
            
            echo "🛠️ Fixing Permissions for Deployment..."
            sudo chown -R ubuntu:www-data /var/www/kilimostore
            sudo chmod -R 777 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database

            echo "📥 Pulling latest code..."
            git pull origin main || git pull origin master
            
            echo "⚙️ Updating Backend..."
            cd /var/www/kilimostore/backend
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🎨 Building Frontend..."
            cd /var/www/kilimostore/frontend
            npm ci
            npm run build
            
            echo "🔐 Finalizing Permissions & Reloading Services..."
            sudo chown -R www-data:www-data /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database
            sudo chmod -R 777 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache /var/www/kilimostore/backend/database
            sudo systemctl reload nginx
            sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm
            
            echo "✅ Deployment Completed Successfully!"
