name: Deploy KilimoStoreMS to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  validate-backend:
    name: 🧪 1. Validate & Test Backend (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      - name: Install & Validate Composer Dependencies
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

  build-frontend:
    name: 🎨 2. Build & Validate Frontend (Vue 3 / Vite)
    needs: validate-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Compile Production Assets
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-to-ec2:
    name: 🚀 3. Deploy Production Build to AWS EC2
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: SSH to AWS EC2 & Trigger Automated Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on AWS EC2..."
            cd /var/www/kilimostore
            
            echo "🗄️ Provisioning MySQL Database Server & Extension..."
            sudo apt-get update -y || true
            sudo apt-get install -y mysql-server php-mysql || true
            sudo systemctl enable mysql || true
            sudo systemctl start mysql || true

            echo "🔑 Creating Clean MySQL Database & User..."
            sudo mysql -e "DROP DATABASE IF EXISTS kilimostore_db;" || true
            sudo mysql -e "CREATE DATABASE kilimostore_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" || true
            sudo mysql -e "CREATE USER IF NOT EXISTS 'kilimo_user'@'localhost' IDENTIFIED BY 'KilimoPass2026!';" || true
            sudo mysql -e "ALTER USER 'kilimo_user'@'localhost' IDENTIFIED BY 'KilimoPass2026!';" || true
            sudo mysql -e "GRANT ALL PRIVILEGES ON kilimostore_db.* TO 'kilimo_user'@'localhost';" || true
            sudo mysql -e "FLUSH PRIVILEGES;" || true

            echo "📥 Pulling latest commits from GitHub..."
            cd /var/www/kilimostore
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            
            echo "⚙️ Configuring Backend to MySQL & Clearing Cached Config..."
            cd /var/www/kilimostore/backend
            rm -rf bootstrap/cache/*.php || true

            echo "APP_NAME=KilimoStore" > .env
            echo "APP_ENV=production" >> .env
            echo "APP_KEY=base64:7vFwX9zK2L3mN4pQ5rS6tU7vW8xY9zA0bC1dE2fG3hI=" >> .env
            echo "APP_DEBUG=false" >> .env
            echo "APP_URL=http://51.20.191.151" >> .env
            echo "LOG_CHANNEL=stack" >> .env
            echo "DB_CONNECTION=mysql" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=3306" >> .env
            echo "DB_DATABASE=kilimostore_db" >> .env
            echo "DB_USERNAME=kilimo_user" >> .env
            echo "DB_PASSWORD=KilimoPass2026!" >> .env
            echo "CACHE_DRIVER=file" >> .env
            echo "SESSION_DRIVER=file" >> .env

            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan key:generate --force || true
            php artisan config:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan migrate:fresh --force
            php artisan db:seed --force
            php artisan config:clear || true

            echo "🎨 Building Production Frontend Assets..."
            cd /var/www/kilimostore/frontend
            npm ci
            npm run build
            
            echo "🔐 Securing Permissions & Reloading Nginx/PHP-FPM..."
            sudo chown -R www-data:www-data /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache
            sudo chmod -R 775 /var/www/kilimostore/backend/storage /var/www/kilimostore/backend/bootstrap/cache
            sudo systemctl reload nginx || true
            sudo systemctl reload php8.3-fpm || sudo systemctl reload php8.2-fpm || sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm || true
            
            echo "✅ KilimoStoreMS Migrated to MySQL & Deployed Successfully to AWS EC2!"
